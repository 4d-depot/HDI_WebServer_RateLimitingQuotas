<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rate Limiting Demo - 4D Web Server</title>
<style>
  :root{
    --bg:#fafaf8;
    --panel:#ffffff;
    --border:#e2e0da;
    --text:#2b2b28;
    --muted:#767268;
    --accent:#3AA2FB;
    --accent-dark:#204d37;
    --warn:#b3492f;
    --ok:#2f6f4f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.4;
  }
  header{
    padding:24px 32px 12px;

  }
  header h1{
    font-size:20px;
    font-weight:400;
    color:var(--accent);
  }
  header p{
    margin:0;
    color:var(--muted);
    font-size:14px;
  }
  main{
    max-width:1200px;
    margin:0 auto;
    padding:5px 32px 64px;
    display:grid;
    gap:20px;
  }
  .single-request-columns{
    display:grid;
    grid-template-columns:repeat(2, minmax(0, 1fr));
    gap:20px;
  }
  .burst-columns{
    display:grid;
    grid-template-columns:repeat(2, minmax(0, 1fr));
    gap:20px;
  }
  @media (max-width:700px){
    .single-request-columns,
    .burst-columns{grid-template-columns:1fr;}
  }
  section{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:8px;
    padding:18px 20px;
  }
  section h2{
    margin:0 0 4px;
    font-size:18px;
    font-weight:600;
  }
 section p.info{
    margin:0 0 4px;
    font-size:14px;
    font-weight:400;
    color:var(--muted);
    margin: 30px 0 0 0px;
  }

 section p.hint{
   font-weight:600;
    margin:0 0 14px;
    color:var(--ok);
    font-size:16px;
    display:flex;
    justify-content:center;
    width:100%;
  }
  .row{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
  }
  
  .blueLabel{
    font-size:20px;
    font-weight:400;
    color:var(--accent);
  }
  
  .row:last-child{margin-bottom:0;}
  label{
    font-size:15px;
    color:var(--muted);
    display:flex;
    align-items:center;
    gap:6px;
  }
  
  .inputData{
    font-size:15px;
    color:var(--text);
    font-weight:600;
  }
  
  .count{
    font-size:15px;
    color:var(--text);
    font-weight:600;
    display:flex;
    margin-left:-6px;
  }
  
   .countKO{
    font-size:15px;
    color:var(--warn);
    font-weight:600;
    display:flex;
    margin-left:-6px;
  }
  
   .countOK{
    font-size:15px;
    color:var(--ok);
    font-weight:600;
    display:flex;
    margin-left:-6px;
  }
  
  input[type=number]{
    width:90px;
    padding:5px 7px;
    border:1px solid var(--border);
    border-radius:5px;
    font-size:13px;
  }
  select{
    padding:5px 7px;
    border:1px solid var(--border);
    border-radius:5px;
    font-size:13px;
    background:#fff;
  }
  input[type=checkbox]{margin: 0}
  button{
    border:1px solid var(--accent);
    background:var(--accent);
    color:#fff;
    padding:7px 14px;
    margin:0;
    border-radius:5px;
    font-size:13px;
    cursor:pointer;
  }
  button:hover{}
  button.secondary{
    background:#fff;
    color:var(--accent);
    border-color:var(--accent);
  }
  button.secondary:hover{background:#f2f1ed;}
  button:disabled{
    opacity:.5;
    cursor:not-allowed;
  }
  #stats{
    display:flex;
    gap:24px;
    flex-wrap:wrap;
    font-size:13px;
  }
  #stats div span{
    display:block;
    font-size:20px;
    font-weight:600;
  }

  #log{
    background:#1e1e1c;
    color:#d9d7cf;
    border-radius:6px;
    padding:10px 12px;
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:12px;
    height:260px;
    overflow-y:auto;
    white-space:pre-wrap;
  }
  #log .l429{color:#e08a6d;}
  #log .lok{color:#8fbf9f;}
  #log .lerr{color:#e08a6d;font-weight:bold;}
  .footer-actions{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin-top:16px;
    width:100%;
  }
  
  #quotas{
    background:var(--panel);
    border-bottom:1px solid var(--border);
    padding:10px 32px;
  }
  #quotas .quotas-title{
    font-size:24px;
    font-weight:600;
    color:var(--accent);
    margin-bottom:8px;
  }
  #quotas .quotas-row{
    display:flex;
    flex-wrap:wrap;
    gap:0;
  }
  #quotas .quota{
    flex:1 1 auto;
    min-width:110px;
    padding:4px 16px;
    border-right:1px solid var(--border);
    text-align:center;
  }
  #quotas .quota:last-child{border-right:none;}
  #quotas .quota .label{
    display:block;
    font-size:11px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.02em;
    margin-bottom:2px;
  }
  #quotas .quota .value{
    display:block;
    font-size:16px;
    font-weight:600;
    color:var(--text);
  }
</style>
</head>
<body>


<header>
  <h1 style="text-align: center;">Rate Limiting Demo - 4D Web Server</h1>
</header>

<main>
  <section>
    <h2>Current Values</h2>
    <div id="stats" class="row">
      <label>Number of sessions:</label><span id="nbSessions" class="count">0</span>
      <label>Number of Guest sessions:</label><span id="nbGuestSessions" class="count">0</span>
      <button id="btnRefreshSessions" type="button">Refresh</button>
    </div>
  </section>

  <div class="single-request-columns">
    <section>
      <h2>Send Data (Single Request)</h2>
      <div class="row">
       <label class="blueLabel">1-</label>
        <label>Generate <input style="text-align:center;" class="inputData" type="number" id="bodySize" value="1000" min="1"> bytes of data</label>
        <button id="btnPostBody">Send this data in a POST</button>
        </br>
         <p class="info"> Ratios:
        - 1000 bytes correspond to 1637 bytes sent in total
        </p>
        <p> 
          <label><input type="checkbox" id="postNewSession">Create a new session for this request</label>
        </p>
      </div>
    </section>

    <section>
      <h2>Request Data (Single Request)</h2>
      </br>
      <div class="row">
        <label class="blueLabel">2-</label>
          <label>Request <input style="text-align: center;"  class="inputData" type="number" id="respSize" value="1000" min="1"> bytes of data</label>
          <button id="btnGetData">Request Data</button>
           <p>
            <label><input type="checkbox" id="getNewSession">Create a new session for this request</label>
          </p>
      </div>
    </section>
  </div>

  <div class="burst-columns">
    <section>
      <h2>Send Data (Request Burst)</h2>

      <div class="row">
        <label>Send data every <input style="text-align: center;" class="inputData" type="number" id="burstPostDelay" value="2" min="1"> seconds</label>
        <label>until reaching <input style="text-align: center;" class="inputData" type="number" id="burstPostCount" value="10" min="1"> requests</label>
      </div>
      <div class="row">
        <label>Size to send: <input style="text-align: center;" class="inputData" type="number" id="burstPostSize" value="1000" min="1"> bytes</label>
      </div>
      <div class="row">
        <label><input type="checkbox" id="burstPostNewSession">Create a new session for each request</label>
      </div>
      <div class="row">
        <div class="footer-actions">
          <button id="btnBurstPostStart">Start POST Burst</button>
          <button id="btnBurstPostStop" class="secondary" disabled>Stop POST Burst</button>
        </div>
        <p class="hint" id="burstPostProgress"></p>
      </div>
    </section>

    <section>
      <h2>Request Data (Request Burst)</h2>
     
      <div class="row">
        <label>Request data every <input style="text-align: center;" class="inputData" type="number" id="burstGetDelay" value="2" min="1"> seconds</label>
        <label>until reaching <input style="text-align: center;" class="inputData" type="number" id="burstGetCount" value="10" min="1"> requests</label>
      </div>
      <div class="row">
        <label>Size to request: <input style="text-align: center;" class="inputData" type="number" id="burstGetSize" value="1000" min="1"> bytes</label>
      </div>
      <div class="row">
        <label><input type="checkbox" id="burstGetNewSession">Create a new session for each request</label>
      </div>
      <div class="row">
        <div class="footer-actions">
          <button id="btnBurstGetStart">Start GET Burst</button>
          <button id="btnBurstGetStop" class="secondary" disabled>Stop GET Burst</button>
        </div>
        <p class="hint" id="burstGetProgress"></p>
      </div>
    </section>
  </div>

  <section>
    <h2>Concurrent Sessions</h2>
    <div class="row">
      <label>Number of Guest sessions to open <input style="text-align: center;" class="inputData"  type="number" id="sessionCount" value="3" min="1"></label>
      <button id="btnOpenSessions">Open Guest Sessions</button>
    </div>
    <div class="row">
      <label>Number of authenticated sessions to open <input style="text-align: center;" class="inputData"  type="number" id="authenticatedSessionCount" value="1" min="1"></label>
      <button id="btnOpenAndAuthenticateSessions">Open and Authenticate Sessions</button>
    </div>
  </section>

  <section>
    <h2>Results</h2>
    <div id="stats">
      <label>Number of requests sent:</label><span id="statTotal" class="count">0</span>
      <label>HTTP status 200 / 2xx:</label><span id="statOk" class="countOK">0</span>
      <label>HTTP status 429:</label><span id="stat429" class="countKO">0</span>
    </div>
    <div class="row footer-actions">
      <button id="btnClearLog" class="secondary">Clear Log</button>
    </div>
    <div id="log"></div>
  </section>

</main>

<script src="./testQuotas.js"></script>
</body>
</html>
