<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Démo Rate Limiting — 4D Web Server</title>
<style>
  :root{
    --bg:#fafaf8;
    --panel:#ffffff;
    --border:#e2e0da;
    --text:#2b2b28;
    --muted:#767268;
    --accent:#3AA2FB;
    --accent-dark:#204d37;
    --warn:#b3492f;
    --ok:#2f6f4f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.4;
  }
  header{
    padding:24px 32px 12px;

  }
  header h1{
    margin:0 0 4px;
    font-size:20px;
    font-weight:400;
    color:#3AA2FB;
  }
  header p{
    margin:0;
    color:var(--muted);
    font-size:14px;
  }
  main{
    max-width:960px;
    margin:0 auto;
    padding:24px 32px 64px;
    display:grid;
    gap:20px;
  }
  section{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:8px;
    padding:18px 20px;
  }
  section h2{
    margin:0 0 4px;
    font-size:18px;
    font-weight:600;
  }
 section p.info{
    margin:0 0 4px;
    font-size:14px;
    font-weight:400;
    color:var(--muted);
    margin:0 0 0 30px;
  }

  section p.hint{
    margin:0 0 14px;
    color:var(--muted);
    font-size:13px;
  }
  .row{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
  }
  
  .blueLabel{
    font-size:20px;
    font-weight:400;
    color:#3AA2FB;
  }
  
  .row:last-child{margin-bottom:0;}
  label{
    font-size:15px;
    color:var(--muted);
    display:flex;
    align-items:center;
    gap:6px;
  }
  
  .inputData{
    font-size:15px;
    color:var(--text);
    font-weight:600;
  }
  
  .count{
    font-size:15px;
    color:var(--muted);
    display:flex;
  }
  
  input[type=number]{
    width:90px;
    padding:5px 7px;
    border:1px solid var(--border);
    border-radius:5px;
    font-size:13px;
  }
  select{
    padding:5px 7px;
    border:1px solid var(--border);
    border-radius:5px;
    font-size:13px;
    background:#fff;
  }
  input[type=checkbox]{margin:0;}
  button{
    border:1px solid var(--accent);
    background:var(--accent);
    color:#fff;
    padding:7px 14px;
    margin:0px 0px 0px; 40px;
    border-radius:5px;
    font-size:13px;
    cursor:pointer;
  }
  button:hover{background:var(--accent-dark);border-color:var(--accent-dark);}
  button.secondary{
    background:#fff;
    color:#3AA2FB;
    border-color:#3AA2FB;
  }
  button.secondary:hover{background:#f2f1ed;}
  button:disabled{
    opacity:.5;
    cursor:not-allowed;
  }
  #stats{
    display:flex;
    gap:24px;
    flex-wrap:wrap;
    font-size:13px;
  }
  #stats div span{
    display:block;
    font-size:20px;
    font-weight:600;
  }

  #log{
    background:#1e1e1c;
    color:#d9d7cf;
    border-radius:6px;
    padding:10px 12px;
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:12px;
    height:260px;
    overflow-y:auto;
    white-space:pre-wrap;
  }
  #log .l429{color:#e08a6d;}
  #log .lok{color:#8fbf9f;}
  #log .lerr{color:#e08a6d;font-weight:bold;}
  .footer-actions{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin-top:16px;
    width:100%;
  }
  
  #quotas{
    background:var(--panel);
    border-bottom:1px solid var(--border);
    padding:10px 32px;
  }
  #quotas .quotas-title{
    font-size:24px;
    font-weight:600;
    color:#3AA2FB;
    margin-bottom:8px;
  }
  #quotas .quotas-row{
    display:flex;
    flex-wrap:wrap;
    gap:0;
  }
  #quotas .quota{
    flex:1 1 auto;
    min-width:110px;
    padding:4px 16px;
    border-right:1px solid var(--border);
    text-align:center;
  }
  #quotas .quota:last-child{border-right:none;}
  #quotas .quota .label{
    display:block;
    font-size:11px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.02em;
    margin-bottom:2px;
  }
  #quotas .quota .value{
    display:block;
    font-size:16px;
    font-weight:600;
    color:var(--text);
  }
</style>
</head>
<body>


<header>
  <h1 style="text-align: center;">Démo Rate Limiting — 4D Web Server</h1>
</header>

<main>

  <section>
    <h2>Requête unique</h2>
    <div class="row">
     <label class="blueLabel">1-</label>
      <label>Générer des données de <input style="text-align:center;" class="inputData" type="number" id="bodySize" value="1000" min="1">octets</label>
      <button id="btnPostBody">Envoyer ces données dans un POST</button>
      </br>
     <p class="info"> Ratios:
      </br>
      - 1000 octets correspondent à 1687 octets envoyés au total
      </p>
    </div>
    </br>
    <div class="row">
      <label class="blueLabel">2-</label>
      <label>Requêter des données de<input style="text-align: center;"  class="inputData" type="number" id="respSize" value="1000" min="1">octets</label>
      <button id="btnGetData">Requêter les données</button>
    </div>
  </section>

  <section>
    <h2>Rafale de requêtes</h2>
      
    <div class="row">
    	  <label>Envoyer 1 requête toutes les <input style="text-align: center;"  class="inputData" type="number" id="burstDelay" value="2" min="1">seconds</label>
      	  <label>jusqu'à atteindre<input style="text-align: center;"  class="inputData" type="number" id="burstCount" value="10" min="1"> requêtes</label>
    </div>
    <div class="row">
      <label>Type de requête
        <select id="burstType" class="inputData" >
          <option value="body">POST avec données</option>
          <option value="data">GET</option>
        </select>
      </label>
      <label>Taille à envoyer ou recevoir (octets) <input style="text-align: center;"  class="inputData" type="number" id="burstSize" value="1000" min="1"></label>
    </div>

     </br>
    <div> 
      <label><input type="checkbox" id="burstNewSession">Créer une nouvelle session à chaque requête</label>

    <div class="row">
      <div class="footer-actions">
        <button id="btnBurstStart">Lancer la rafale</button>
        <button id="btnBurstStop" class="secondary" disabled>Arrêter</button>
      </div>
      <span class="hint" id="burstProgress" style="margin:0;"></span>
    </div>
    </div>
  </section>

  <section>
    <h2>Sessions concurrentes</h2>
    <div class="row">
      <label>Nombre de sessions (Guest) à ouvrir <input style="text-align: center;" class="inputData"  type="number" id="sessionCount" value="3" min="1"></label>
      <button id="btnOpenSessions">Ouvrir les sessions (Guest)</button>
    </div>
    <div class="row">
      <label>Nombre de sessions à ouvrir avec authentification<input style="text-align: center;" class="inputData"  type="number" id="authenticatedSessionCount" value="1" min="1"></label>
      <button id="btnOpenAndAuthenticateSessions">Ouvrir et authentifier les sessions</button>
    </div>
  </section>

  <section>
    <h2>Résultats</h2>
    <div id="stats">
      <label>Nombre de requêtes envoyées:</label><span id="statTotal" class="count">0</span>
      <label>HTTP status 200 / 2xx:</label><span id="statOk" class="count">0</span>
      <label>HTTP status 429:</label><span id="stat429" class="count">0</span>
    </div>
    </br>
    <div class="row">
      <label>Nombre de sessions:</label><span id="nbSessions" class="count">0</span>
      <label>Nombre de sessions Guest:</label><span id="nbGuestSessions" class="count">0</span>
    </div>
    <div class="row; footer-actions" style="margin-top:12px;">
      <button id="btnClearLog" class="secondary">Vider le journal</button>
    </div>
    </br>
    <div id="log"></div>
  </section>

</main>

<script src="./testQuotas.js"></script>
</body>
</html>
